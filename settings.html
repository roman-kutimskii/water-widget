<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tide Settings</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <form id="settings-form">
      <section class="group">
        <h2>Timing</h2>

        <div class="row">
          <label for="interval-number">Interval</label>
          <div class="control">
            <input type="range" id="interval-range" min="10" max="180" step="1" />
            <input type="number" id="interval-number" min="10" max="180" step="1" />
            <span class="unit">min</span>
          </div>
        </div>

        <div class="row">
          <label>Active hours</label>
          <div class="control">
            <input type="time" id="active-start" />
            <span class="dash">–</span>
            <input type="time" id="active-end" />
          </div>
        </div>

        <div class="row">
          <label>Quiet hours</label>
          <div class="control">
            <input type="time" id="quiet-start" />
            <span class="dash">–</span>
            <input type="time" id="quiet-end" />
          </div>
        </div>

        <div class="row">
          <label for="daily-goal">Daily goal</label>
          <div class="control">
            <input type="number" id="daily-goal" min="1" max="30" step="1" />
            <span class="unit">drinks</span>
          </div>
        </div>
      </section>

      <section class="group">
        <h2>Look</h2>

        <div class="row">
          <label for="opacity-range">Opacity</label>
          <div class="control">
            <input type="range" id="opacity-range" min="30" max="100" step="1" />
            <span id="opacity-value" class="unit">90%</span>
          </div>
        </div>

        <div class="row checkbox-row">
          <label for="show-text">Show remaining time text</label>
          <input type="checkbox" id="show-text" />
        </div>

        <div class="row checkbox-row">
          <label for="show-count">Show today's count</label>
          <input type="checkbox" id="show-count" />
        </div>

        <div class="row">
          <label for="layout-select">Layout</label>
          <div class="control">
            <select id="layout-select">
              <option value="horizontal">Horizontal</option>
              <option value="vertical">Vertical</option>
              <option value="compact">Compact</option>
            </select>
          </div>
        </div>

        <div class="row">
          <label for="scale-range">Size</label>
          <div class="control">
            <input type="range" id="scale-range" min="75" max="150" step="5" />
            <span id="scale-value" class="unit">100%</span>
          </div>
        </div>

        <div class="row">
          <label for="color-preset-select">Color preset</label>
          <div class="control">
            <select id="color-preset-select">
              <option value="default">Default</option>
              <option value="colorblind">Colorblind-safe</option>
              <option value="mono">Monochrome</option>
            </select>
          </div>
        </div>

        <div class="row">
          <label for="reduced-motion-select">Reduced motion</label>
          <div class="control">
            <select id="reduced-motion-select">
              <option value="system">System</option>
              <option value="on">On</option>
              <option value="off">Off</option>
            </select>
          </div>
        </div>
      </section>

      <section class="group">
        <h2>Behavior</h2>

        <div class="row checkbox-row">
          <label for="always-on-top">Always on top</label>
          <input type="checkbox" id="always-on-top" />
        </div>

        <div class="row checkbox-row">
          <label for="click-through">Click-through</label>
          <input type="checkbox" id="click-through" />
        </div>

        <div class="row checkbox-row">
          <label for="autostart">Start with Windows</label>
          <input type="checkbox" id="autostart" />
        </div>

        <div class="row checkbox-row">
          <label for="hotkey-enabled">Global hotkey enabled</label>
          <input type="checkbox" id="hotkey-enabled" />
        </div>

        <div class="row">
          <label for="hotkey-text">Hotkey</label>
          <div class="control">
            <input type="text" id="hotkey-text" placeholder="e.g. Ctrl+Alt+W" />
          </div>
          <span class="hint">e.g. Ctrl+Alt+W</span>
        </div>
      </section>

      <section class="group">
        <h2>Alerts</h2>

        <div class="row checkbox-row">
          <label for="toast-enabled">Toast notifications</label>
          <input type="checkbox" id="toast-enabled" />
        </div>

        <div class="row">
          <label for="nudge-every">Nudge every</label>
          <div class="control">
            <input type="number" id="nudge-every" min="1" max="60" step="1" />
            <span class="unit">min</span>
          </div>
        </div>

        <div class="row">
          <label for="nudge-max">Max nudges</label>
          <div class="control">
            <input type="number" id="nudge-max" min="0" max="10" step="1" />
          </div>
        </div>

        <div class="row checkbox-row">
          <label for="sound-enabled">Sound</label>
          <input type="checkbox" id="sound-enabled" />
        </div>

        <div class="row">
          <label for="sound-volume">Volume</label>
          <div class="control">
            <input type="range" id="sound-volume" min="0" max="100" step="1" />
            <span id="sound-volume-value" class="unit">50%</span>
            <button type="button" id="test-sound-btn">Test</button>
          </div>
        </div>
      </section>

      <section class="group">
        <h2>Stats</h2>

        <div class="row">
          <div id="stats-summary" class="stats-summary">Streak 0 days · Best 0 · Total 0 drinks</div>
        </div>

        <div class="row">
          <div id="stats-chart" class="stats-chart-wrap"></div>
        </div>
      </section>

      <section class="group">
        <h2>Data</h2>

        <div class="row">
          <div class="control">
            <button type="button" id="open-data-dir-btn">Open data folder</button>
          </div>
        </div>

        <div class="row">
          <div id="data-status" class="hint"></div>
        </div>

        <div class="row">
          <div class="control">
            <button type="button" id="reset-all-btn" class="danger">Reset all</button>
          </div>
        </div>
      </section>

      <div class="spacer"></div>

      <div class="row footer-row">
        <button type="button" id="reset-today-btn">Reset today</button>
        <button type="button" id="quit-btn" class="danger">Quit Tide</button>
      </div>
    </form>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
